# Builds the extension zip from this repository's source and attaches it to the GitHub Release.
# Runs when a version tag (v1.2.3) is pushed, including one made on the "Draft a new release" page.
# The build itself lives in scripts/build.mjs (run it locally with: npm ci && npm run build).
name: Build release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_ON: ${{ secrets.CWS_EXTENSION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build
        id: build
        run: npm run build -- --tag "${{ github.ref_name }}"

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip }}
          append_body: true
          body: |

            **SHA-256:** `${{ steps.build.outputs.sha256 }}` (built from ${{ github.sha }} by GitHub Actions)

      # Chrome Web Store: uploads the same zip and submits it for review.
      # Skipped until the five CWS_* secrets are added in Settings > Secrets and variables > Actions.
      - name: Upload to the Chrome Web Store
        if: env.CWS_ON == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@4.0.2 --source "${{ steps.build.outputs.zip }}"
