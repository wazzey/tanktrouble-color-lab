# Builds the extension zip from this repository's source and attaches it to the GitHub Release.
# Runs when a version tag (v1.2.3) is pushed, including one made on the "Draft a new release" page.
# The build itself lives in scripts/build.mjs (run it locally with: npm ci && npm run build).
name: Build release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_ON: ${{ secrets.CWS_EXTENSION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build
        id: build
        run: npm run build -- --tag "${{ github.ref_name }}"

      # Release notes: this version's section of CHANGELOG.md, then the zip's SHA-256
      - name: Release notes
        id: notes
        run: |
          awk -v v="## ${{ github.ref_name }}" 'index($0, v)==1 && (length($0)==length(v) || substr($0, length(v)+1, 1)==":"){on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          title=$(grep -m1 "^## ${{ github.ref_name }}:" CHANGELOG.md | sed 's/^## //')
          echo "title=${title:-${{ github.ref_name }}}" >> "$GITHUB_OUTPUT"
          printf '\n**SHA-256:** `%s` (built from %s by GitHub Actions)\n' "${{ steps.build.outputs.sha256 }}" "${{ github.sha }}" >> notes.md
          printf '\nThe `-webstore.zip` is the same files for the Chrome Web Store (SHA-256 `%s`). To install by hand, use the other zip.\n' "${{ steps.build.outputs.store_sha256 }}" >> notes.md

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.store_zip }}
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md

      # Chrome Web Store: uploads the same zip and submits it for review.
      # Skipped until the five CWS_* secrets are added in Settings > Secrets and variables > Actions.
      - name: Upload to the Chrome Web Store
        if: env.CWS_ON == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@4.0.2 --source "${{ steps.build.outputs.store_zip }}"
